<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
</head>
<body bgcolor="EBD5E8">
<form>
<img src="./kba logo.jpg.jpg" height="35" width="50"><br>
<a href="Home.html">Home |</a>
<a href="./Courses.html">Courses |</a>
<a href="./contact.html">Contact Us |</a>
<a href="./Add course.html">Add Course |</a>
<a href="./login.html">Logout</a>  
<center>
    <font color="7A218A"><h2>Add Course</h2></font>
</center> 
<center>
    <table cellspacing="15">
        <tr>
            <td>Course name</td>
        </tr>
            <td>
                <input type="text" placeholder="eg.Certified Blockchain Associate" required>
            </td>
        </tr>
        <tr>
            <td>Course Id</td>
        </tr>
        <tr>
            <td>
                <input type="text" placeholder="eg.1">
            </td>
        </tr>
        <tr>
            <td>Course Type</td>
        </tr>
        <tr>
            <TD>
            <select name="Course" required>
            <option value="c1">Self paced</option>
            <option value="c2">Hybrid</option>
            <option value="c3">live classes</option>
            <option value="c4">on campus</option>
            </select>
            </TD>
        </tr>
        <tr>
            <td>Description</td>
        </tr>
        <td>
            <textarea rows="5" cols="" placeholder="small description on the course" required></textarea>
        </td>
        <tr>
            <td>Price</td>
        </tr>
        <td>
            <select name="price" required>
            <option value="p1">Rs.15000</option>
            <option value="p2">Rs.20000</option>
            <option value="p3">Rs.25000</option>
            </select>
        </td>
        <tr>
            <td>
                <input type="submit" value="Add Course" required>
            </td>
        </tr>
    </table>
</center> 
</form>
</body>
</html>
